[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicalgestures"
# Single source of truth: musicalgestures/__init__.py.
# A second static copy here drifts the moment a bump touches one of
# them, which is how the sibling toolboxes shipped releases that
# misreported their own version.
dynamic = ["version"]
description = "Musical Gestures Toolbox for Python"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "University of Oslo fourMs Lab", email = "a.r.jensenius@imv.uio.no"},
]
requires-python = ">=3.10"
keywords = ["computer vision", "motion analysis", "musical gestures", "video analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # >=0.3 was wrong twice over: no such release exists on PyPI below 0.6, and the functions
    # this package re-exports arrived much later. The floor is now 1.0.0, where `group_qom`
    # stopped counting markers it could not see. Below that the re-exported function returns a
    # different, confounded number, so this is a correctness floor and not only a docs one.
    "micromotion>=1.13.0",
    "numpy",
    "pandas",
    "matplotlib",
    "opencv-python",
    "scipy",
    "scikit-image",
    "librosa",
    "ipython>=7.12",
    "tqdm>=4.60",
]

[project.optional-dependencies]
pose = ["mediapipe>=0.10"]
# Reading motion vectors as numbers, MgVideo.motionvectordata(). ffprobe reports that the
# side data is present but will not print the vectors, and ffmpeg has no numeric dump, so
# PyAV is the only route to them. MgVideo.motionvectors(), which draws them, needs only
# ffmpeg and stays available without this.
motionvectors = ["av>=10"]
c3d = ["c3d>=0.5"]
ml = ["scikit-learn>=1.2", "torch>=2.0", "torchvision>=0.15"]
cli = ["click>=8.0"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.5", "nox>=2023.4"]
soundscape = ["ambiscape>=0.17"]
full = ["musicalgestures[pose,ml,cli,c3d,soundscape,motionvectors]"]

[project.urls]
Homepage = "https://github.com/fourMs/MGT-python"
Documentation = "https://fourms.github.io/MGT-python"
Repository = "https://github.com/fourMs/MGT-python"
"Bug Tracker" = "https://github.com/fourMs/MGT-python/issues"

[project.scripts]
musicalgestures = "musicalgestures.cli:main"

[tool.setuptools.dynamic]
version = { attr = "musicalgestures.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["musicalgestures*"]

[tool.setuptools.package-data]
musicalgestures = ["py.typed", "*.avi", "*.ipynb", "examples/*", "pose/*", "models/*"]

[tool.ruff]
# Exclude the most problematic legacy directories from linting
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "musicalgestures/deprecated",
    "musicalgestures/3rdparty",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E","W","F"]
ignore = ["E401","E711","E712","E721","E722","F401","F405","F811","F821","F841"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F403", "F405"]
"*/__init__.py" = ["F401", "F403"]
"examples/*.py" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
# Don't descend into imported third-party sources — some ship 3.12-only syntax that aborts the
# run on our 3.10 target (e.g. tifffile's `type` statement). We only type-check our own package.
follow_imports = "skip"
exclude = "musicalgestures/(deprecated|3rdparty)/"
