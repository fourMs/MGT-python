site_name: "MGT-python: Musical Gestures Toolbox"
site_description: "Musical Gestures Toolbox for Python - Tools for visualization and analysis of audio and video"
site_url: https://fourms.github.io/MGT-python/
repo_url: https://github.com/fourMs/MGT-python
repo_name: fourMs/MGT-python
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Start:
      - Installation: installation.md
      - Quick Start: quickstart.md
      - Gallery: gallery.md
      - Examples: examples.md
  - Concepts: concepts.md
  - Ways of looking:
      - Loading & Showing: user-guide/loading.md
      - Preprocessing: user-guide/preprocessing.md
      - Video Analysis: user-guide/video-analysis.md
      - Working with Results: user-guide/results.md
  - Measuring & segmenting:
      - Pose Tracking: user-guide/pose-tracking.md
      - Audio Analysis: user-guide/audio-analysis.md
      - Audio-Video Analysis: user-guide/audio-video.md
      - Sound-Movement Analysis Toolkit: user-guide/sound-movement-toolkit.md
  - Reference:
      - Overview: musicalgestures/index.md
      - Core Classes: user-guide/core-classes.md
      - Core:
          - Video: musicalgestures/_video.md
          - Audio: musicalgestures/_audio.md
          - Utils: musicalgestures/_utils.md
      - Looking:
          - Posegram: musicalgestures/_posegram.md
          - Contact sheet: musicalgestures/_contactsheet.md
          - Multi-shot: musicalgestures/_multishot.md
      - Measuring:
          - Flow: musicalgestures/_flow.md
          - Motion vectors: musicalgestures/_motionvectors.md
          - Noise floor: musicalgestures/_noisefloor.md
          - Effort: musicalgestures/_effort.md
      - Segmenting:
          - Actions: musicalgestures/_actions.md
          - Postures: musicalgestures/_postures.md
          - Hierarchy: musicalgestures/_hierarchy.md
          - Tracks: musicalgestures/_tracks.md
          - Room and occupancy: musicalgestures/_plate.md
      - Annotating & interpreting:
          - Annotate: musicalgestures/_annotate.md
          - Timeline: musicalgestures/_timeline.md
          - Select: musicalgestures/_select.md
          - Voice: musicalgestures/_voice.md
          - Laughter: musicalgestures/_laughter.md
          - Correlate: musicalgestures/_correlate.md
          - Co-accentuation: musicalgestures/_coaccentuation.md
          - Co-occurrence: musicalgestures/_cooccurrence.md
          - ELAN import: musicalgestures/_elan.md
          - Annotation views: musicalgestures/_views.md
          - Zoomable page: musicalgestures/_zoomview.md
      - Special formats:
          - 360 Video: musicalgestures/_360video.md
          - Anglegram (360): musicalgestures/_anglegram.md
      - Complete Reference: MODULES.md
  - Development:
      - Contributing: contributing.md
      - Testing: testing.md
      - Releasing: releases.md
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  # Old page URLs that must keep resolving. mkdocs-redirects writes a small
  # meta-refresh page at each old path, so an external bookmark still lands.
  - redirects:
      redirect_maps:
        musicalgestures/_centroid.md: musicalgestures/index.md
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: auto
            show_source: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
